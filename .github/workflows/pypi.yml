name: PyPI

on:
  release:
    types: [published]

concurrency:
  group: pypi
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Tag matches pyproject version
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_bytes())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag not in {version, f"v{version}"}:
              sys.exit(f"release tag {tag!r} does not match pyproject version {version}")
          PY
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Wheel contains client index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert wheels, "no wheel"
          assert sdists, "no sdist"
          names = zipfile.ZipFile(wheels[0]).namelist()
          assert any(n.endswith("reviewdistill/web/static/index.html") for n in names), names[:20]
          PY
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
